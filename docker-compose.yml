version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bms_db
      MYSQL_USER: bms_user
      MYSQL_PASSWORD: bms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/data:/docker-entrypoint-initdb.d
    networks:
      - bms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bms_user
      SPRING_DATASOURCE_PASSWORD: bms_password
      # Security
      SECURITY_JWT_SECRET: fw7t4cntm2c94r2djjfdjf3498tyhg23048gfhigjv4
      # VNPay config (sandbox)
      DEMO_VNPAY_TMNCODE: 4YUP19I4
      DEMO_VNPAY_HASHSECRET: MDUIFDCRAKLNBPOFIAFNEKFRNMFBYEPX
      DEMO_VNPAY_PAYURL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      DEMO_VNPAY_RETURNURL: http://localhost:8080/vnpay/return
      DEMO_VNPAY_IPNURL: http://localhost:8080/vnpay/ipn
      # Cloudinary config
      CLOUDINARY_CLOUD_NAME: dbt2mnpq6
      CLOUDINARY_API_KEY: 628856391957287
      CLOUDINARY_API_SECRET: F6uBkfDknZyE3hUMVAGL23DLTKw
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bms_network
    volumes:
      - backend_logs:/app/logs

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bms_network

volumes:
  mysql_data:
  backend_logs:

networks:
  bms_network:
    driver: bridge
