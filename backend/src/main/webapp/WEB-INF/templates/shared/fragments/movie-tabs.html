<!-- Movie Tabs Section -->
<div th:fragment="movie-tabs" class="movie-tabs-container">
  <div class="movie-tabs">
    <button class="movie-tab active" data-tab="now-showing">
      Phim đang chiếu
    </button>
    <button class="movie-tab" data-tab="coming-soon">Phim sắp chiếu</button>
  </div>

  <!-- Now Showing Movies -->
  <div class="lotte-tab-content active" id="now-showing">
    <div class="lotte-movie-grid" id="nowShowingMoviesContainer">
      <!-- Show message if no movies -->
      <div
        th:if="${#lists.isEmpty(nowShowingMovies)}"
        class="no-movies-message"
        style="text-align: center; padding: 50px; color: #666"
      >
        <h3>Không có phim đang chiếu nào</h3>
        <p>Vui lòng quay lại sau!</p>
      </div>

      <div
        th:each="movie : ${nowShowingMovies}"
        class="lotte-movie-card"
        th:data-genre="${movie.genres != null ? movie.genres : ''}"
        th:data-director="${movie.director}"
        th:data-year="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,4) : ''}"
      >
        <div class="lotte-movie-poster">
          <img th:src="${movie.posterUrl}" th:alt="${movie.title}" />
          <div class="lotte-movie-overlay">
            <div class="lotte-movie-buttons">
              <a
                th:href="@{/movies/{id}(id=${movie.id}, autoBook=true)}"
                class="lotte-btn-book"
                >Đặt vé</a
              >
              <a
                th:href="@{/movies/{id}(id=${movie.id})}"
                class="lotte-btn-detail"
                >Chi tiết</a
              >
            </div>
          </div>
        </div>
        <div class="lotte-movie-info">
          <div class="lotte-movie-rating">
            <span
              class="lotte-age-rating"
              th:text="${movie.ageRating != null and movie.ageRating != '' ? movie.ageRating : (movie.duration > 120 ? '13' : 'K')}"
              >K</span
            >
            <span class="lotte-movie-title" th:text="${movie.title}">
              Tên phim</span
            >
          </div>
          <div class="lotte-movie-meta">
            <span
              class="lotte-movie-duration"
              th:text="${movie.duration + 'Phút'}"
              >120Phút</span
            >
            <span
              class="lotte-movie-date"
              th:text="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,10) : ''}"
              >01/08/2025</span
            >
          </div>
          <!-- Hidden elements for filtering -->
          <span
            class="lotte-movie-genre"
            style="display: none"
            th:text="${movie.genres != null ? movie.genres : ''}"
            >Genre</span
          >
          <span
            class="lotte-movie-director"
            style="display: none"
            th:text="${movie.director}"
            >Director</span
          >
          <span
            class="lotte-movie-year"
            style="display: none"
            th:text="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,4) : ''}"
            >Year</span
          >
        </div>
      </div>
    </div>

    <!-- Load More Button -->
    <div class="load-more-container" th:if="${nowShowingHasMore}">
      <button class="load-more-btn" id="loadMoreNowShowing">
        Xem thêm phim
      </button>
      <div class="load-more-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Coming Soon Movies -->
  <div class="lotte-tab-content" id="coming-soon">
    <div class="lotte-movie-grid" id="comingSoonMoviesContainer">
      <!-- Show message if no movies -->
      <div
        th:if="${#lists.isEmpty(comingSoonMovies)}"
        class="no-movies-message"
        style="text-align: center; padding: 50px; color: #666"
      >
        <h3>Không có phim sắp chiếu nào</h3>
        <p>Vui lòng quay lại sau!</p>
      </div>

      <div
        th:each="movie : ${comingSoonMovies}"
        class="lotte-movie-card"
        th:data-genre="${movie.genres != null ? movie.genres : ''}"
        th:data-director="${movie.director}"
        th:data-year="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,4) : ''}"
      >
        <div class="lotte-movie-poster">
          <img th:src="${movie.posterUrl}" th:alt="${movie.title}" />
          <div class="lotte-movie-overlay">
            <div class="lotte-movie-buttons">
              <a
                th:href="@{/movies/{id}(id=${movie.id})}"
                class="lotte-btn-detail"
                >Chi tiết</a
              >
            </div>
          </div>
        </div>
        <div class="lotte-movie-info">
          <div class="lotte-movie-rating">
            <span
              class="lotte-age-rating"
              th:text="${movie.ageRating != null and movie.ageRating != '' ? movie.ageRating : (movie.duration > 120 ? '13' : 'K')}"
              >K</span
            >
            <span class="lotte-movie-title" th:text="${movie.title}">
              Tên phim</span
            >
          </div>
          <div class="lotte-movie-meta">
            <span
              class="lotte-movie-duration"
              th:text="${movie.duration + 'Phút'}"
              >120Phút</span
            >
            <span
              class="lotte-movie-date"
              th:text="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,10) : ''}"
              >01/08/2025</span
            >
          </div>
          <!-- Hidden elements for filtering -->
          <span
            class="lotte-movie-genre"
            style="display: none"
            th:text="${movie.genres != null ? movie.genres : ''}"
            >Genre</span
          >
          <span
            class="lotte-movie-director"
            style="display: none"
            th:text="${movie.director}"
            >Director</span
          >
          <span
            class="lotte-movie-year"
            style="display: none"
            th:text="${movie.releaseDate != null ? movie.releaseDate.toString().substring(0,4) : ''}"
            >Year</span
          >
        </div>
      </div>
    </div>

    <div class="load-more-container" th:if="${comingSoonHasMore}">
      <button class="load-more-btn" id="loadMoreComingSoon">
        Xem thêm phim
      </button>
      <div class="load-more-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
</div>
