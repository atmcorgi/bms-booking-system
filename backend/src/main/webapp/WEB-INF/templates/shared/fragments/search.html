<!-- Search Fragment - Reusable across pages -->
<div th:fragment="search-bar" class="search-section">
  <div class="container">
    <div class="search-container">
      <!-- Left side: Always visible filters -->
      <div class="filter-side">
        <!-- Genre Filter -->
        <div class="filter-group">
          <div class="custom-dropdown">
            <div class="dropdown-trigger" id="genre-dropdown-trigger">
              <span class="dropdown-text">Tất cả thể loại</span>
              <span class="dropdown-arrow">▼</span>
            </div>
            <div class="dropdown-menu" id="genre-dropdown-menu">
              <div class="dropdown-item" data-value="">Tất cả thể loại</div>
              <!-- Genres will be loaded dynamically -->
            </div>
          </div>
        </div>

        <!-- Year Filter -->
        <div class="filter-group">
          <div class="year-filter-container">
            <input
              type="text"
              id="year-filter"
              class="filter-input"
              placeholder="Nhập nhiều năm, ví dụ: 2023,2024"
            />
            <div class="year-quick-filters">
              <button type="button" class="year-btn" data-year="">
                Tất cả
              </button>
              <button type="button" class="year-btn" data-year="2025">
                2025
              </button>
              <button type="button" class="year-btn" data-year="2024">
                2024
              </button>
              <button type="button" class="year-btn" data-year="2023">
                2023
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right side: Search bar -->
      <div class="search-side">
        <div class="search-box">
          <input
            type="text"
            class="search-input"
            placeholder="Tìm kiếm phim, diễn viên, đạo diễn..."
            id="global-search-input"
          />
          <button class="search-btn" id="search-btn">
            <span class="search-icon">🔍</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
