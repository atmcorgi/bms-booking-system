<!-- Quick Booking Section -->
<section th:fragment="quick-booking" class="fd-quick-booking-section">
  <div class="fd-quick-booking-header">
    <h2>ĐẶT VÉ NHANH</h2>
    <p>Chọn rạp yêu thích và tìm phim phù hợp</p>
  </div>
  <div class="fd-quick-booking-content">
    <div class="fd-quick-booking-card">
      <div class="fd-quick-booking-icon">🎬</div>
      <h3>Chọn Rạp</h3>
      <p>Bắt đầu từ rạp chiếu phim gần bạn nhất</p>
      <a th:href="@{/booking/theater}" class="fd-quick-booking-btn"
        >Bắt đầu đặt vé</a
      >
    </div>
    <div class="fd-quick-booking-card">
      <div class="fd-quick-booking-icon">🎭</div>
      <h3>Chọn Phim</h3>
      <p>Tìm phim yêu thích và xem lịch chiếu</p>
      <a th:href="@{/}" class="fd-quick-booking-btn">Chọn phim trước</a>
    </div>
  </div>
</section>
