<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{staff/layout/base :: html}"
>
  <head>
    <title th:text="${pageTitle}">Staff Dashboard</title>
  </head>
  <body>
    <div th:fragment="content">
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0" th:text="${pageTitle}"></h1>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-right">
                <li class="breadcrumb-item active">Staff Dashboard</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <section class="content">
        <div class="container-fluid">
          <!-- Error Message -->
          <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
          </div>

          <!-- Welcome Message -->
          <div th:unless="${error}" class="row">
            <div class="col-12">
              <div class="alert alert-info">
                <h5>
                  <i class="fas fa-info-circle"></i> Chào mừng đến với Staff
                  Dashboard!
                </h5>
                <p>
                  Quản lý phim đã được ADMIN assign cho theater của bạn: lập
                  lịch và publish.
                </p>
              </div>
            </div>
          </div>

          <!-- Statistics -->
          <div th:unless="${error}" class="row">
            <div class="col-lg-4 col-6">
              <div class="small-box bg-primary">
                <div class="inner">
                  <h3 th:text="${assignedCount}">0</h3>
                  <p>Phim đã assign</p>
                </div>
                <div class="icon">
                  <i class="fas fa-link"></i>
                </div>
                <a
                  th:href="@{/staff/workflow/assigned}"
                  class="small-box-footer"
                >
                  Xem chi tiết <i class="fas fa-arrow-circle-right"></i>
                </a>
              </div>
            </div>
            <div class="col-lg-4 col-6">
              <div class="small-box bg-warning">
                <div class="inner">
                  <h3 th:text="${scheduledCount}">0</h3>
                  <p>Đã lập lịch</p>
                </div>
                <div class="icon">
                  <i class="fas fa-calendar"></i>
                </div>
                <a th:href="@{/staff/scheduling/auto}" class="small-box-footer">
                  Lập lịch <i class="fas fa-arrow-circle-right"></i>
                </a>
              </div>
            </div>
            <div class="col-lg-4 col-6">
              <div class="small-box bg-success">
                <div class="inner">
                  <h3 th:text="${publishedCount}">0</h3>
                  <p>Đã publish</p>
                </div>
                <div class="icon">
                  <i class="fas fa-globe"></i>
                </div>
                <a th:href="@{/}" class="small-box-footer">
                  Xem website <i class="fas fa-arrow-circle-right"></i>
                </a>
              </div>
            </div>
          </div>

          <!-- Quick Actions -->
          <div th:unless="${error}" class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">
                    <i class="fas fa-bolt"></i> Quick Actions
                  </h3>
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-4">
                      <a
                        th:href="@{/staff/workflow/assigned}"
                        class="btn btn-primary btn-block"
                      >
                        <i class="fas fa-list"></i> Xem phim đã assign
                      </a>
                    </div>
                    <div class="col-md-4">
                      <a
                        th:href="@{/staff/scheduling/auto}"
                        class="btn btn-warning btn-block"
                      >
                        <i class="fas fa-magic"></i> Lập lịch tự động
                      </a>
                    </div>
                    <div class="col-md-4">
                      <a
                        th:href="@{/staff/workflow/scheduled}"
                        class="btn btn-success btn-block"
                      >
                        <i class="fas fa-globe"></i> Publish phim
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
