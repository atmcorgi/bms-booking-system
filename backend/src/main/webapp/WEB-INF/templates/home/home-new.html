<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} ?: 'My Cinema - Phim Đang Chiếu & Sắp Chiếu'">
      My Cinema
    </title>
    <link rel="stylesheet" th:href="@{/resources/css/shared/style.css}" />
  </head>
  <body>
    <!-- Include Header -->
    <div th:replace="~{shared/fragments/header :: top-header}"></div>
    <div th:replace="~{shared/fragments/header :: main-header}"></div>

    <!-- Main Content -->
    <main>
      <!-- Include Section Title and Movie Banner -->
      <div th:replace="~{shared/fragments/movie-banner :: section-title}"></div>
      <div th:replace="~{shared/fragments/movie-banner :: movie-banner}"></div>

      <!-- Include Search Bar -->
      <div th:replace="~{shared/fragments/search :: search-bar}"></div>

      <div class="container">
        <!-- Include Movie Tabs -->
        <div th:replace="~{shared/fragments/movie-tabs :: movie-tabs}"></div>
      </div>

      <!-- Include Quick Booking Section -->
      <div
        th:replace="~{shared/fragments/quick-booking :: quick-booking}"
      ></div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{shared/fragments/footer :: footer}"></div>

    <!-- Scripts -->
    <script th:src="@{/resources/js/movie/home.js}"></script>
    <script th:src="@{/resources/js/movie/search-filter.js}"></script>
    <script th:src="@{/resources/js/shared/navbar-active.js}"></script>
    <script th:src="@{/resources/js/home/load-more.js}"></script>
  </body>
</html>
