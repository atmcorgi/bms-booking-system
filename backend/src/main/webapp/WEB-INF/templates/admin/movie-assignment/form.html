<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/base :: html}"
>
  <head>
    <title th:text="${pageTitle}">Assign Movies to Theaters</title>
  </head>
  <body>
    <div th:fragment="content">
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0" th:text="${pageTitle}">
                Assign Movies to Theaters
              </h1>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-right">
                <li class="breadcrumb-item"><a href="/admin">Admin</a></li>
                <li class="breadcrumb-item active">Movie Assignment</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <section class="content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-8">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">Assign Movie to Theater</h3>
                </div>
                <form
                  th:action="@{/admin/movie-assignment/assign}"
                  method="post"
                >
                  <div class="card-body">
                    <div class="form-group">
                      <label for="movieId">Movie</label>
                      <select
                        class="form-control"
                        id="movieId"
                        name="movieId"
                        required
                      >
                        <option value="">Select a movie</option>
                        <option
                          th:each="movie : ${movies}"
                          th:value="${movie.id}"
                          th:text="${movie.title + ' (' + movie.code + ')'}"
                        >
                          Movie Title
                        </option>
                      </select>
                    </div>

                    <div class="form-group">
                      <label for="theaterId">Theater</label>
                      <select
                        class="form-control"
                        id="theaterId"
                        name="theaterId"
                        required
                      >
                        <option value="">Select a theater</option>
                        <option
                          th:each="theater : ${theaters}"
                          th:value="${theater.id}"
                          th:text="${theater.name + ' (' + theater.code + ')'}"
                        >
                          Theater Name
                        </option>
                      </select>
                    </div>

                    <div class="row">
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="activeFrom">Active From</label>
                          <input
                            type="date"
                            class="form-control"
                            id="activeFrom"
                            name="activeFrom"
                            th:value="${#dates.format(#dates.createToday(), 'yyyy-MM-dd')}"
                          />
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="activeTo">Active To (Optional)</label>
                          <input
                            type="date"
                            class="form-control"
                            id="activeTo"
                            name="activeTo"
                          />
                        </div>
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="formats">Formats (Optional)</label>
                          <input
                            type="text"
                            class="form-control"
                            id="formats"
                            name="formats"
                            placeholder="e.g., 2D, 3D, IMAX"
                          />
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="languages">Languages (Optional)</label>
                          <input
                            type="text"
                            class="form-control"
                            id="languages"
                            name="languages"
                            placeholder="e.g., Vietnamese, English"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <button type="submit" class="btn btn-primary">
                      Assign Movie
                    </button>
                    <a href="/admin" class="btn btn-secondary">Cancel</a>
                  </div>
                </form>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">Quick Actions</h3>
                </div>
                <div class="card-body">
                  <a
                    href="/admin/movie-assignment/list"
                    class="btn btn-info btn-block mb-2"
                  >
                    <i class="fas fa-list"></i> View All Assignments
                  </a>
                  <a
                    href="/admin/theater"
                    class="btn btn-success btn-block mb-2"
                  >
                    <i class="fas fa-building"></i> Manage Theaters
                  </a>
                  <a
                    href="/admin/movie/intake/upload"
                    class="btn btn-warning btn-block mb-2"
                  >
                    <i class="fas fa-upload"></i> Import Movies
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
