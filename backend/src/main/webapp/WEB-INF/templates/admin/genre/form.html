<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/base :: html}"
>
  <head>
    <title th:text="${pageTitle} ?: 'Thể loại'">Thể loại</title>
  </head>
  <body>
    <div th:fragment="content">
      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="brand">Admin</div>
          <div th:replace="admin/fragments/navbar :: sidebar"></div>
        </aside>
        <section class="admin-content">
          <div class="admin-header">
            <h1 th:text="${pageTitle}">Thể loại</h1>
          </div>
          <form
            class="admin-form"
            method="post"
            th:action="${genre.id} == null ? @{/admin/genres} : @{'/admin/genres/' + ${genre.id}}"
            th:object="${genre}"
          >
            <div class="form-row">
              <label for="name">Tên</label>
              <input id="name" type="text" th:field="*{name}" required />
            </div>
            <div class="form-row">
              <label for="description">Mô tả</label>
              <textarea
                id="description"
                th:field="*{description}"
                rows="3"
              ></textarea>
            </div>
            <div class="form-actions">
              <a class="btn" href="/admin/genres">Hủy</a>
              <button class="btn primary" type="submit">Lưu</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
