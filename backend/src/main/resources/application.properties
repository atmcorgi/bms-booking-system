# --- Timezone and JSON time config ---
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Database Configuration (from ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# SePay Configuration
sepay.bank.acc=${SEPAY_BANK_ACC}
sepay.bank.name=${SEPAY_BANK_NAME}
sepay.api.key=${SEPAY_API_KEY}
sepay.merchant.id=${SEPAY_MERCHANT_ID}
sepay.secret.key=${SEPAY_SECRET_KEY}

# Security
security.jwt.secret=${SECURITY_JWT_SECRET}

# Google OAuth (ENV)
google.client-id=${GOOGLE_CLIENT_ID}

# Mail SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.address=${MAIL_USERNAME}
mail.from.name=CineManager Support

# Frontend base URL (for reset password link)
app.frontend.base-url=${FRONTEND_BASE_URL:https://localhost:5173}

# Cloudinary Configuration (ENV)
# Get these values from your Cloudinary dashboard: https://cloudinary.com/console
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}