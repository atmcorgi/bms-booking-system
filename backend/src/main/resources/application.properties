# --- Timezone and JSON time config ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Database Configuration (from ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# VNPAY config (ENV)
demo.vnpay.tmnCode=${VNPAY_TMN_CODE}
demo.vnpay.hashSecret=${VNPAY_HASH_SECRET}
demo.vnpay.payUrl=${VNPAY_PAY_URL}
demo.vnpay.returnUrl=${VNPAY_RETURN_URL}
demo.vnpay.ipnUrl=${VNPAY_IPN_URL}

# Security
security.jwt.secret=${SECURITY_JWT_SECRET}

# Cloudinary Configuration (ENV)
# Get these values from your Cloudinary dashboard: https://cloudinary.com/console
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}